name: Daily Follower Snapshots

# Scheduled from Supabase pg_cron (docs/supabase-cron.sql), not here: GitHub turns off
# scheduled workflows after 60 days without commits. Kept as a manual backup.
on:
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch follower counts
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-delay 5 --retry-connrefused \
            -X POST "${{ secrets.SITE_URL }}/api/worker/follower-snapshots" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
