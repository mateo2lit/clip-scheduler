name: AI Clips

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ai_clip_jobs row ID"
        required: true
      # Everything below except team_id and user_id is legacy. Inputs are public (public repo),
      # so the source link and the user's prompt are read from the ai_clip_jobs row instead.
      # They stay declared only so a dispatch from an older deploy isn't rejected.
      source_file_path:
        description: "Legacy, leave empty: read from the job row"
        required: false
        default: ""
      source_bucket:
        description: "Legacy, leave empty: read from the job row"
        required: false
        default: ""
      source_url:
        description: "Legacy, leave empty: read from the job row"
        required: false
        default: ""
      team_id:
        description: "Team ID"
        required: true
      user_id:
        description: "User ID"
        required: true
      clip_count:
        description: "Legacy, leave empty: read from the job row"
        required: false
        default: ""
      genre:
        description: "Legacy, leave empty: read from the job row"
        required: false
        default: ""
      clip_length:
        description: "Legacy, leave empty: read from the job row"
        required: false
        default: ""
      auto_hook:
        description: "Legacy, leave empty: read from the job row"
        required: false
        default: ""
      moment_prompt:
        description: "Legacy, leave empty: read from the job row"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-clips-team-${{ inputs.team_id }}
      cancel-in-progress: false
    # The repo is public, so run logs are public. Inputs and secrets reach the scripts
    # only through env (never ${{ }} inside run:), so a pasted URL or a moment prompt
    # can't inject shell and the scripts printed in the logs contain no values.
    env:
      JOB_ID: ${{ inputs.job_id }}

    steps:
      # Only the word cleanup module (GTA spelled "G -T -A" etc.); the rest of the repo isn't needed
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ai_clips_words.py
          sparse-checkout-cone-mode: false

      # The job's settings come from its DB row, not from inputs (public). They reach later steps
      # through GITHUB_ENV with a random heredoc delimiter, so a newline in the prompt can't add
      # variables. The source URL is masked in case a tool prints it.
      - name: Load job settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Fallbacks for a dispatch from an older deploy (the row should always have them)
          INPUT_SOURCE_URL: ${{ inputs.source_url }}
          INPUT_SOURCE_FILE_PATH: ${{ inputs.source_file_path }}
          INPUT_SOURCE_BUCKET: ${{ inputs.source_bucket }}
          INPUT_CLIP_COUNT: ${{ inputs.clip_count }}
          INPUT_GENRE: ${{ inputs.genre }}
          INPUT_CLIP_LENGTH: ${{ inputs.clip_length }}
          INPUT_AUTO_HOOK: ${{ inputs.auto_hook }}
          INPUT_MOMENT_PROMPT: ${{ inputs.moment_prompt }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.parse, urllib.request, uuid

          env = os.environ
          cols = "source_url,source_file_path,source_bucket,clip_count,genre,clip_length,auto_hook,moment_prompt"
          req = urllib.request.Request(
              f"{env['SUPABASE_URL']}/rest/v1/ai_clip_jobs?id=eq.{urllib.parse.quote(env['JOB_ID'])}&select={cols}",
              headers={"Authorization": f"Bearer {env['SUPABASE_SERVICE_ROLE_KEY']}",
                       "apikey": env["SUPABASE_SERVICE_ROLE_KEY"]},
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              rows = json.loads(resp.read().decode())
          if not rows:
              raise RuntimeError("ai_clip_jobs row not found")
          row = rows[0]

          def pick(col, default):
              v = row.get(col)
              if v is None or v == "":
                  v = env.get(f"INPUT_{col.upper()}", "")
              if isinstance(v, bool):
                  v = "true" if v else "false"
              v = str(v)
              return v if v != "" else default

          values = {
              "SOURCE_URL": pick("source_url", ""),
              "SOURCE_FILE_PATH": pick("source_file_path", ""),
              "SOURCE_BUCKET": pick("source_bucket", "clips"),
              "CLIP_COUNT": pick("clip_count", "5"),
              "GENRE": pick("genre", "auto"),
              "CLIP_LENGTH": pick("clip_length", "auto"),
              # A missing auto_hook has always meant on
              "AUTO_HOOK": pick("auto_hook", "true"),
              "MOMENT_PROMPT": pick("moment_prompt", ""),
          }
          url = values["SOURCE_URL"].replace("\r", "").replace("\n", "")
          values["SOURCE_URL"] = url
          if url:
              print(f"::add-mask::{url}", flush=True)

          with open(env["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for name, value in values.items():
                  delim = f"EOF_{uuid.uuid4().hex}"
                  f.write(f"{name}<<{delim}\n{value}\n{delim}\n")
          print("Loaded job settings: source=" + ("url" if url else "file")
                + f", clips={values['CLIP_COUNT']}, prompt={'yes' if values['MOMENT_PROMPT'] else 'no'}", flush=True)
          PYEOF

      - name: Install dependencies
        run: |
          # ffmpeg is pre-installed on ubuntu-latest runners; check before installing
          if command -v ffmpeg &>/dev/null; then
            echo "ffmpeg ready: $(ffmpeg -version 2>&1 | head -1)"
          else
            echo "ffmpeg not found, installing..."
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          # PyAV 19 removed av.open(metadata_errors=...), which faster-whisper 1.2.x still passes
          pip install faster-whisper "av<19" anthropic yt-dlp 2>&1 | tail -5
          pip install -U yt-dlp 2>&1 | tail -3
          echo "yt-dlp version: $(yt-dlp --version)"

      - name: Acquire source video
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SOURCE_URL" ]; then
            # Not echoed, and yt-dlp's output goes to a file only: run logs are public.
            echo "Downloading from URL"
            fetch_source() {
              timeout 480 yt-dlp "$@" \
                -f "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=720]+bestaudio/best[height<=720]/best" \
                --merge-output-format mp4 \
                --max-filesize 2G \
                --socket-timeout 60 \
                --retries 10 \
                --extractor-retries 5 \
                --force-ipv4 \
                --no-warnings \
                -o /tmp/source.mp4 \
                "$SOURCE_URL" >> /tmp/yt_dlp_log.txt 2>&1
              local rc=$?
              echo "yt-dlp exit code: $rc"
              return "$rc"
            }
            # YouTube links aren't accepted (prepare-url): YouTube bot-blocks GitHub's IPs.
            fetch_source
          else
            echo "Downloading from Supabase Storage: ${SOURCE_FILE_PATH}"
            HTTP_STATUS=$(curl -sS -o /tmp/source.mp4 -w "%{http_code}" \
              --max-time 600 \
              "${SUPABASE_URL}/storage/v1/object/${SOURCE_BUCKET}/${SOURCE_FILE_PATH}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

            echo "Download HTTP status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "206" ]; then
              echo "Download failed with HTTP status $HTTP_STATUS"
              exit 1
            fi
          fi

          if [ ! -s /tmp/source.mp4 ]; then
            echo "Source file is empty or missing"
            exit 1
          fi
          echo "Source size: $(stat -c%s /tmp/source.mp4) bytes"

          # Update actual duration in DB (important for URL-sourced jobs)
          DURATION_SECS=$(ffprobe -v quiet -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 /tmp/source.mp4 2>/dev/null || echo "0")
          DURATION_MINS=$(python3 -c "d=float('${DURATION_SECS}' or '0'); print(round(d/60,1))")
          echo "Duration: ${DURATION_MINS} min"
          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/ai_clip_jobs?id=eq.${JOB_ID}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"source_duration_minutes\":${DURATION_MINS},\"updated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Mark job as transcribing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/ai_clip_jobs?id=eq.${JOB_ID}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"transcribing\",\"updated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Extract audio and transcribe with word timestamps
        run: |
          # Extract audio at 16kHz mono WAV for Whisper
          ffmpeg -i /tmp/source.mp4 \
            -vn -ar 16000 -ac 1 -f wav \
            /tmp/audio.wav -y \
            2>/tmp/ffmpeg_audio_log.txt

          if [ ! -s /tmp/audio.wav ]; then
            echo "Audio extraction failed"
            tail -5 /tmp/ffmpeg_audio_log.txt
            exit 1
          fi

          python3 - <<'PYEOF'
          import sys
          import os
          import json
          from faster_whisper import WhisperModel
          sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts"))
          from ai_clips_words import normalize_text, normalize_words

          print("Loading Whisper base model...", flush=True)
          model = WhisperModel("base", device="cpu", compute_type="int8")
          print("Transcribing with word timestamps...", flush=True)

          segments, info = model.transcribe(
              "/tmp/audio.wav",
              beam_size=5,
              language=None,
              vad_filter=True,
              word_timestamps=True,
          )

          transcript_lines = []
          all_words = []

          for seg in segments:
              transcript_lines.append(f"[{seg.start:.1f}s-{seg.end:.1f}s] {normalize_text(seg.text.strip())}")
              if seg.words:
                  for w in seg.words:
                      all_words.append({
                          "start": round(w.start, 3),
                          "end": round(w.end, 3),
                          "word": w.word.strip(),
                      })

          all_words = normalize_words(all_words)
          transcript = "\n".join(transcript_lines) if transcript_lines else "[No speech detected]"

          with open("/tmp/transcript.txt", "w") as f:
              f.write(transcript)

          with open("/tmp/word_segments.json", "w") as f:
              json.dump(all_words, f)

          print(f"Transcript: {len(transcript_lines)} segments, {len(all_words)} words", flush=True)
          PYEOF

      - name: Mark job as detecting
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/ai_clip_jobs?id=eq.${JOB_ID}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"detecting\",\"updated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Detect best moments with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import anthropic
          import json
          import os
          import subprocess

          clip_count = int(os.environ.get("CLIP_COUNT", "5"))
          genre = os.environ.get("GENRE", "auto") or "auto"
          clip_length = os.environ.get("CLIP_LENGTH", "auto") or "auto"
          auto_hook = os.environ.get("AUTO_HOOK", "true").lower() in ("true", "1", "yes")
          moment_prompt = os.environ.get("MOMENT_PROMPT", "").strip()

          # Clip duration constraints based on clip_length setting
          length_map = {
              "short":  (15, 45),
              "medium": (45, 90),
              "long":   (90, 180),
          }
          min_secs, max_secs = length_map.get(clip_length, (30, 120))

          with open("/tmp/transcript.txt") as f:
              transcript = f.read()

          # Get video duration
          result = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "format=duration",
               "-of", "default=noprint_wrappers=1:nokey=1", "/tmp/source.mp4"],
              capture_output=True, text=True
          )
          total_duration = float(result.stdout.strip() or "0")
          print(f"Video duration: {total_duration:.1f}s", flush=True)

          client = anthropic.Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])

          genre_context = f"This is a {genre} video. " if genre != "auto" else ""
          hook_rule = "- At least one clip should begin with a strong hook or attention-grabbing opening\n" if auto_hook else ""
          moment_rule = f"- Prioritize finding moments about: {moment_prompt}\n" if moment_prompt else ""

          prompt = (
              f"You are analyzing a video transcript to find the {clip_count} best moments for short-form social media clips (TikTok, Instagram Reels, YouTube Shorts).\n"
              f"{genre_context}\n"
              f"Video duration: {total_duration:.0f} seconds\n"
              f"Transcript (format: [start-end] text):\n"
              f"{transcript[:8000]}\n\n"
              f"Find exactly {clip_count} distinct, engaging moments. Each clip must be {min_secs}-{max_secs} seconds long.\n\n"
              "Rules:\n"
              "- Clips must not overlap\n"
              f"- Start/end times must be within 0 to {total_duration:.0f} seconds\n"
              "- Prefer: high energy moments, key insights, funny/surprising moments, strong hooks\n"
              f"{hook_rule}"
              f"{moment_rule}"
              "- If transcript is sparse/silent, space clips evenly across the video\n"
              "- A clip should be self-contained: it must make sense to someone who has not seen the rest of the video\n"
              "- Start the clip at the beginning of a thought, not mid-sentence\n\n"
              "For each moment return these fields:\n"
              '- "start" / "end": seconds (numbers)\n'
              '- "title": 5-10 words, descriptive, suitable as a social media post title\n'
              '- "hook_title": a punchy on-screen hook of AT MOST 8 words, written to stop a scroll. '
              "Curiosity, conflict, a number, or a bold claim. This is overlay text, not a sentence — no trailing period.\n"
              '- "score": an integer 0-100 estimating how well this clip would perform as a standalone short.\n'
              '- "reason": ONE short sentence explaining the score.\n\n'
              "Score honestly and use the whole range — a flat list of 80s is useless. Calibrate roughly like this:\n"
              "- 85-100: a genuinely strong hook in the first 3 seconds, a clear payoff, and it stands alone with no missing context\n"
              "- 65-84: interesting and self-contained, but the opening is slow or the payoff is mild\n"
              "- 40-64: decent content that needs setup the viewer will not have, or it meanders\n"
              "- 0-39: filler, small talk, or a section with no discernible hook at all\n"
              "If the transcript is sparse or silent, score honestly low rather than inventing enthusiasm.\n\n"
              "Order the array from HIGHEST score to LOWEST — the best clip must be first.\n\n"
              "Respond with ONLY valid JSON (no markdown, no code blocks):\n"
              '[{"start": 45.2, "end": 98.7, "title": "Compelling title here", '
              '"hook_title": "He lost $40k in one trade", "score": 87, '
              '"reason": "Opens on a concrete number and pays off within ten seconds."}, ...]\n\n'
              f"Return exactly {clip_count} items."
          )

          msg = client.messages.create(
              model="claude-haiku-4-5-20251001",
              max_tokens=2048,
              messages=[{"role": "user", "content": prompt}]
          )

          text = msg.content[0].text if msg.content else ""
          print(f"Claude response: {len(text)} chars", flush=True)

          # Clean and parse JSON
          cleaned = text.replace("```json", "").replace("```", "").strip()
          try:
              moments = json.loads(cleaned)
              if not isinstance(moments, list):
                  raise ValueError("Not a list")
          except (json.JSONDecodeError, ValueError) as e:
              print(f"JSON parse error: {e} — using evenly spaced fallback", flush=True)
              clip_dur = min(60.0, total_duration / clip_count)
              moments = []
              for i in range(clip_count):
                  start = (total_duration / clip_count) * i
                  moments.append({
                      "start": round(start, 1),
                      "end": round(min(start + clip_dur, total_duration), 1),
                      "title": f"Clip {i + 1}"
                  })

          def clamp_score(raw):
              """Score is advisory, so a missing or junk value must never fail the run —
              it falls back to 50 (neutral) rather than 0, which would read as a verdict."""
              try:
                  return max(0, min(100, int(round(float(raw)))))
              except (TypeError, ValueError):
                  return 50

          # Validate and clamp each moment
          validated = []
          for i, m in enumerate(moments[:clip_count]):
              start = max(0.0, float(m.get("start", 0)))
              end = min(total_duration, float(m.get("end", start + 60)))
              # Enforce max 120s
              if end - start > 120:
                  end = start + 120
              # Enforce min 5s
              if end - start < 5:
                  end = min(start + 30, total_duration)
              title = str(m.get("title", f"Clip {i + 1}"))[:200]
              hook = str(m.get("hook_title") or "").strip()[:100]
              reason = str(m.get("reason") or "").strip()[:300]
              validated.append({
                  "start": round(start, 1),
                  "end": round(end, 1),
                  "title": title,
                  "hook_title": hook,
                  "score": clamp_score(m.get("score")),
                  "reason": reason,
              })

          # Pad if Claude returned fewer than requested
          while len(validated) < clip_count:
              i = len(validated)
              start = round((total_duration / clip_count) * i, 1)
              end = round(min(start + 60, total_duration), 1)
              validated.append({
                  "start": start, "end": end, "title": f"Clip {i + 1}",
                  "hook_title": "", "score": 50, "reason": "",
              })

          # Claude is asked to return best-first, but a re-sort guarantees it even when
          # it doesn't comply — index 0 is the top clip everywhere downstream.
          validated.sort(key=lambda m: m["score"], reverse=True)

          with open("/tmp/moments.json", "w") as f:
              json.dump(validated, f, indent=2)

          print(f"Moments saved ({len(validated)} clips):", flush=True)
          for m in validated:
              print(f"  [{m['score']:3d}] {m['start']:.1f}s-{m['end']:.1f}s ({m['end']-m['start']:.1f}s)", flush=True)
          PYEOF

      - name: Mark job as cutting
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/ai_clip_jobs?id=eq.${JOB_ID}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"cutting\",\"updated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Cut clips and upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEAM_ID: ${{ inputs.team_id }}
          USER_ID: ${{ inputs.user_id }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import uuid
          import urllib.request
          import urllib.error

          supabase_url = os.environ["SUPABASE_URL"]
          service_key = os.environ["SERVICE_KEY"]
          team_id = os.environ["TEAM_ID"]
          user_id = os.environ["USER_ID"]
          job_id = os.environ["JOB_ID"]

          with open("/tmp/moments.json") as f:
              moments = json.load(f)

          with open("/tmp/word_segments.json") as f:
              all_words = json.load(f)

          result_upload_ids = []
          result_titles = []
          result_subtitles = []
          result_moments = []

          for i, moment in enumerate(moments):
              start = moment["start"]
              end = moment["end"]
              title = moment["title"]
              duration = min(end - start, 120.0)
              out_path = f"/tmp/clip_{i}.mp4"

              print(f"\nCutting clip {i+1}/{len(moments)}: {start:.1f}s-{end:.1f}s ({duration:.1f}s)", flush=True)

              # FFmpeg cut + transcode (same flags as import-clip.yml)
              proc = subprocess.run([
                  "ffmpeg",
                  "-ss", str(start),
                  "-i", "/tmp/source.mp4",
                  "-t", str(duration),
                  "-map", "0:v:0",
                  "-map", "0:a:0?",
                  "-c:v", "libx264",
                  "-preset", "fast",
                  "-crf", "23",
                  "-pix_fmt", "yuv420p",
                  "-r", "30",
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-ar", "48000",
                  "-ac", "2",
                  "-movflags", "+faststart",
                  out_path, "-y"
              ], capture_output=True, text=True)

              if proc.returncode != 0:
                  print(f"FFmpeg error: {proc.stderr[-500:]}", flush=True)
                  raise RuntimeError(f"FFmpeg cut failed for clip {i+1}")

              if not os.path.exists(out_path) or os.path.getsize(out_path) == 0:
                  raise RuntimeError(f"Output missing for clip {i+1}")

              file_size = os.path.getsize(out_path)
              print(f"  Output: {file_size:,} bytes", flush=True)

              # Upload to Supabase Storage
              storage_path = f"{team_id}/ai_{job_id}_{i}.mp4"
              storage_url = f"{supabase_url}/storage/v1/object/clips/{storage_path}"

              with open(out_path, "rb") as f:
                  data = f.read()

              req = urllib.request.Request(
                  storage_url,
                  data=data,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {service_key}",
                      "Content-Type": "video/mp4",
                  }
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      upload_status = resp.status
              except urllib.error.HTTPError as e:
                  upload_status = e.code
                  print(f"  Storage upload response: {e.read()[:200]}", flush=True)

              if upload_status not in (200, 201):
                  raise RuntimeError(f"Storage upload failed (HTTP {upload_status}) for clip {i+1}")

              # Create uploads row
              upload_id = str(uuid.uuid4())
              uploads_url = f"{supabase_url}/rest/v1/uploads"
              payload = json.dumps({
                  "id": upload_id,
                  "user_id": user_id,
                  "team_id": team_id,
                  "bucket": "clips",
                  "file_path": storage_path,
                  "file_size": file_size,
                  "storage_deleted": False,
              }).encode()

              req2 = urllib.request.Request(
                  uploads_url,
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {service_key}",
                      "apikey": service_key,
                      "Content-Type": "application/json",
                      "Prefer": "return=minimal",
                  }
              )
              try:
                  with urllib.request.urlopen(req2) as resp:
                      row_status = resp.status
              except urllib.error.HTTPError as e:
                  row_status = e.code
                  print(f"  Uploads row response: {e.read()[:200]}", flush=True)

              if row_status not in (200, 201):
                  raise RuntimeError(f"Failed to create uploads row (HTTP {row_status}) for clip {i+1}")

              # Extract per-clip word segments (relative timestamps)
              clip_words = [
                  {"start": round(w["start"] - start, 3),
                   "end": round(w["end"] - start, 3),
                   "word": w["word"]}
                  for w in all_words
                  if w["start"] >= start and w["end"] <= end
              ]

              result_upload_ids.append(upload_id)
              result_titles.append(title)
              result_subtitles.append(clip_words)
              result_moments.append({
                  "index": i,
                  "start_sec": start,
                  "end_sec": end,
                  "title": title,
                  "hook_title": moment.get("hook_title", ""),
                  "score": moment.get("score", 50),
                  "reason": moment.get("reason", ""),
              })

              print(f"  Created upload {upload_id} ({len(clip_words)} subtitle words)", flush=True)
              os.remove(out_path)

          # Save results for the done step
          with open("/tmp/ai_clips_results.json", "w") as f:
              json.dump({
                  "result_upload_ids": result_upload_ids,
                  "result_titles": result_titles,
                  "result_subtitles": result_subtitles,
                  "result_moments_json": result_moments,
              }, f)

          print(f"\nAll {len(result_upload_ids)} clips created successfully", flush=True)
          PYEOF

      - name: Delete source video from Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Clean up the temporary source file — it's no longer needed
          curl -sS -X DELETE \
            "${SUPABASE_URL}/storage/v1/object/clips" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg p "$SOURCE_FILE_PATH" '{prefixes:[$p]}')" \
            || echo "Source cleanup failed (non-fatal)"

      - name: Mark job as done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import datetime
          import urllib.request

          supabase_url = os.environ["SUPABASE_URL"]
          service_key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          job_id = os.environ["JOB_ID"]

          with open("/tmp/ai_clips_results.json") as f:
              results = json.load(f)

          now = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")

          payload = json.dumps({
              "status": "done",
              "clips_generated": len(results["result_upload_ids"]),
              "result_upload_ids": results["result_upload_ids"],
              "result_titles": results["result_titles"],
              "result_subtitles": results["result_subtitles"],
              "result_moments_json": results.get("result_moments_json", []),
              "updated_at": now,
          }).encode()

          req = urllib.request.Request(
              f"{supabase_url}/rest/v1/ai_clip_jobs?id=eq.{job_id}",
              data=payload,
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {service_key}",
                  "apikey": service_key,
                  "Content-Type": "application/json",
              }
          )
          with urllib.request.urlopen(req) as resp:
              print(f"Marked done: HTTP {resp.status}", flush=True)
          PYEOF

      - name: Mark failed on error
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ERR_MSG="AI clip generation failed."
          for LOG in /tmp/ffmpeg_audio_log.txt /tmp/yt_dlp_log.txt; do
            if [ -f "$LOG" ] && [ -s "$LOG" ]; then
              SNIPPET=$(tail -5 "$LOG" | tr '\n' ' ' | sed 's/["\]//g' | cut -c1-300)
              if [ -n "$SNIPPET" ]; then
                ERR_MSG="$SNIPPET"
              fi
            fi
          done
          # A silent video fails audio extraction with an ffmpeg log line; say what it means instead.
          # Keep in sync with NO_AUDIO_MESSAGE in src/app/ai-clips/page.tsx (the browser catches MP4s first).
          if [ -s /tmp/source.mp4 ] && [ -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 /tmp/source.mp4 2>/dev/null)" ]; then
            ERR_MSG="This video has no sound. AI Clips finds the best moments by listening to what's said, so pick a video with audio."
          fi
          # Check if the source file is still missing (yt-dlp likely timed out or was blocked)
          if [ ! -s /tmp/source.mp4 ]; then
            if [ -n "$SOURCE_URL" ]; then
              # Keep in sync with DOWNLOAD_FAILED.unavailable in src/app/ai-clips/waitCopy.ts;
              # the app matches it to offer "Upload the video file instead".
              ERR_MSG="We couldn't download this video. It may be private, age-restricted or region-locked. Upload the video file instead, and we'll use the same settings."
            fi
          fi

          # Also try to delete the source file on failure
          curl -sS -X DELETE \
            "${SUPABASE_URL}/storage/v1/object/clips" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg p "$SOURCE_FILE_PATH" '{prefixes:[$p]}')" \
            || true

          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/ai_clip_jobs?id=eq.${JOB_ID}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg e "${ERR_MSG}" '{status:"failed",error:$e,updated_at:(now|todate)}')"
