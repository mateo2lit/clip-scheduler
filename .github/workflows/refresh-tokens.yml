name: Refresh Platform Tokens

# Scheduled from Supabase pg_cron (docs/supabase-cron.sql), not here: GitHub turns off
# scheduled workflows after 60 days without commits. Kept as a manual backup.
on:
  workflow_dispatch: {}

jobs:
  refresh-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Call refresh-tokens endpoint
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-delay 5 --retry-connrefused \
            --max-time 300 \
            -X POST "${{ secrets.WORKER_URL_REFRESH_TOKENS }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
