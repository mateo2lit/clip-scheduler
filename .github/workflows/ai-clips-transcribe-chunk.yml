# .github/workflows/ai-clips-transcribe-chunk.yml
name: AI Clips — Transcribe Chunks (matrix)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ai_clip_jobs row ID"
        required: true
      chunks_total:
        description: "Total number of audio chunks to transcribe"
        required: true

# The repo is public, so run logs are public. Inputs and secrets reach the scripts only
# through env (never ${{ }} inside run:), so a crafted value can't inject shell and the
# scripts printed in the logs contain no values.
jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.gen.outputs.indices }}
    env:
      CHUNKS_TOTAL: ${{ inputs.chunks_total }}
    steps:
      - name: Generate chunk index matrix
        id: gen
        run: |
          N=$(printf '%s' "$CHUNKS_TOTAL" | tr -cd '0-9')
          # json.dumps prints one line, so nothing extra can reach GITHUB_OUTPUT
          INDICES=$(python3 -c "import json, sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$N")
          echo "indices=$INDICES" >> $GITHUB_OUTPUT

  transcribe:
    needs: build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk_index: ${{ fromJSON(needs.build-matrix.outputs.indices) }}
    continue-on-error: true
    env:
      JOB_ID: ${{ inputs.job_id }}
      CHUNK_INDEX: ${{ matrix.chunk_index }}
    steps:
      # Only the word cleanup module (GTA spelled "G -T -A" etc.); the rest of the repo isn't needed
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ai_clips_words.py
          sparse-checkout-cone-mode: false

      - name: Install dependencies
        run: |
          if ! command -v ffmpeg &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          # PyAV 19 removed av.open(metadata_errors=...), which faster-whisper 1.2.x still passes
          pip install -q faster-whisper "av<19"

      - name: Download chunk
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PADDED=$(printf "%03d" "$CHUNK_INDEX")
          STORAGE_PATH="ai_audio_chunks/${JOB_ID}/chunk_${PADDED}.opus"
          curl -fsS -o /tmp/chunk.opus \
            "${SUPABASE_URL}/storage/v1/object/clips/${STORAGE_PATH}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
          ls -la /tmp/chunk.opus

      - name: Mark chunk as transcribing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/ai_clip_audio_chunks?job_id=eq.${JOB_ID}&chunk_index=eq.${CHUNK_INDEX}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"status":"transcribing","updated_at":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}'

      - name: Transcribe with distil-whisper
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          from faster_whisper import WhisperModel
          sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts"))
          from ai_clips_words import normalize_text, normalize_words

          # distil-whisper-medium.en is fast on CPU and high quality for English.
          model = WhisperModel("distil-medium.en", device="cpu", compute_type="int8")
          segments, info = model.transcribe(
              "/tmp/chunk.opus",
              beam_size=5,
              language="en",
              vad_filter=True,
              word_timestamps=True,
          )

          words = []
          lines = []
          for seg in segments:
              lines.append(normalize_text(seg.text.strip()))
              if seg.words:
                  for w in seg.words:
                      words.append({"start": round(w.start, 3), "end": round(w.end, 3), "word": w.word.strip()})

          out = {"transcript": " ".join(lines), "word_segments_json": normalize_words(words)}
          with open("/tmp/result.json", "w") as f:
              json.dump(out, f)
          print(f"Transcribed {len(words)} words")
          PYEOF

      - name: Persist chunk result
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # status "done" is what the merge workflow checks; without it every chunk reads as failed.
          jq '. + {status: "done", updated_at: (now | todate)}' /tmp/result.json > /tmp/body.json
          curl -fsS -X PATCH \
            "${SUPABASE_URL}/rest/v1/ai_clip_audio_chunks?job_id=eq.${JOB_ID}&chunk_index=eq.${CHUNK_INDEX}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d @/tmp/body.json

      - name: Mark chunk failed on error
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/ai_clip_audio_chunks?job_id=eq.${JOB_ID}&chunk_index=eq.${CHUNK_INDEX}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"status":"failed","error":"transcribe job failed"}'

  trigger-merge:
    needs: transcribe
    runs-on: ubuntu-latest
    if: always()
    env:
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - name: Dispatch merge workflow
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ai-clips-merge.yml/dispatches" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -nc --arg id "$JOB_ID" '{ref:"main",inputs:{job_id:$id}}')"
